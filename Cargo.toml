[package]
name = "heed-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Watch Claude Code and Codex agent threads on your machine"
license = "MIT"
repository = "https://github.com/nibbletech-labs/heed"
readme = "README.md"
keywords = ["claude", "codex", "agents", "cli", "daemon"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "heed"
path = "src/main.rs"

[lib]
name = "heed"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.22"
notify = "6"
crossterm = "0.27"
ratatui = "0.26"
nix = { version = "0.28", features = ["signal", "process"] }
chrono = "0.4"
walkdir = "2"
log = "0.4"
env_logger = "0.11"
thiserror = "1"
anyhow = "1"
ctrlc = "3"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
