[package]
name = "heed-cli"
version = "0.3.1"
edition = "2021"
rust-version = "1.75"
description = "Watch Claude Code and Codex agent threads on your machine"
license = "MIT"
repository = "https://github.com/nibbletech-labs/heed"
readme = "README.md"
keywords = ["claude", "codex", "agents", "cli", "daemon"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "heed"
path = "src/main.rs"

[lib]
name = "heed"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.22"
notify = "6"
crossterm = "0.27"
ratatui = "0.26"
nix = { version = "0.28", features = ["signal", "process", "user", "fs"] }
chrono = "0.4"
walkdir = "2"
log = "0.4"
env_logger = "0.11"
thiserror = "1"
anyhow = "1"
# `termination`: also catch SIGTERM/SIGHUP, so `launchctl bootout` and
# `SMAppService.unregister` take the daemon through the same final state
# flush as Ctrl-C.
ctrlc = { version = "3", features = ["termination"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSObject", "NSString", "NSError"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService", "SMErrors", "objc2", "objc2-foundation"] }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
